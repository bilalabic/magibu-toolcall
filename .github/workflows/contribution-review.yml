name: Contribution guidance

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: contribution-guidance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # This trusted base-branch script reads only PR metadata and file names. It
      # never checks out or executes code from the contribution branch.
      - name: Check contribution form and update PR comment
        uses: actions/github-script@v9
        with:
          retries: 2
          script: |
            const {
              MARKER,
              analyzeContribution,
              renderComment,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contribution-guidance.cjs`);
            const body = context.payload.pull_request.body || '';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const paths = files.map(file => file.filename);
            const analysis = analyzeContribution({body, paths});
            const checkedAt = new Intl.DateTimeFormat('tr-TR', {
              timeZone: 'Europe/Istanbul',
              dateStyle: 'long',
              timeStyle: 'medium',
            }).format(new Date());
            const commentBody = renderComment({
              analysis,
              guideUrl: `${context.payload.repository.html_url}/blob/${context.payload.pull_request.base.sha}/CONTRIBUTING.md`,
              checkedAt,
              headSha: context.payload.pull_request.head.sha,
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(MARKER)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
