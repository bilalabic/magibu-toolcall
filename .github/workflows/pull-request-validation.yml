name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test contribution guidance
        run: node --test .github/scripts/contribution-guidance.test.cjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Validate registries
        shell: bash
        run: |
          magibu-toolcall registry validate registry/registry.jsonl
          proposal_registry_files=()
          if [[ -d registry/proposals ]]; then
            mapfile -d '' invalid_proposal_files < <(
              find registry/proposals -maxdepth 1 -type f -name '*.json' -print0
            )
            if (( ${#invalid_proposal_files[@]} > 0 )); then
              echo "Registry proposal contributions must use .jsonl files." >&2
              printf 'Unsupported file: %s\n' "${invalid_proposal_files[@]}" >&2
              exit 1
            fi
            mapfile -d '' proposal_registry_files < <(
              find registry/proposals -maxdepth 1 -type f -name '*.jsonl' -print0
            )
          fi
          if (( ${#proposal_registry_files[@]} > 0 )); then
            magibu-toolcall registry validate registry/proposals
          fi

      - name: Validate blueprints
        shell: bash
        run: |
          mapfile -d '' invalid_blueprint_files < <(
            find blueprints -type f -name '*.json' -print0
          )
          if (( ${#invalid_blueprint_files[@]} > 0 )); then
            echo "Blueprint contributions must use .jsonl files." >&2
            printf 'Unsupported file: %s\n' "${invalid_blueprint_files[@]}" >&2
            exit 1
          fi
          mapfile -d '' blueprint_files < <(
            find blueprints -type f -name '*.jsonl' -print0
          )
          if (( ${#blueprint_files[@]} > 0 )); then
            mapfile -d '' proposal_registry_files < <(
              find registry/proposals -maxdepth 1 -type f -name '*.jsonl' -print0
            )
            if (( ${#proposal_registry_files[@]} == 0 )); then
              echo "Blueprint validation requires registry proposal fragments." >&2
              exit 1
            fi
            for file in "${blueprint_files[@]}"; do
              magibu-toolcall blueprint validate "$file" --registry registry/proposals
            done
          fi

      - name: Validate representative dataset record
        run: magibu-toolcall dataset validate tests/fixtures/dataset/valid_single_tool.json

      - name: Validate committed accepted data
        shell: bash
        run: |
          if [[ -d data/dataset/accepted ]]; then
            find data/dataset/accepted -type f \( -name '*.json' -o -name '*.jsonl' \) -print0 |
              while IFS= read -r -d '' file; do
                magibu-toolcall dataset validate "$file"
              done
          fi
          for directory in data/benchmark/accepted data/benchmark/gold; do
            if [[ -d "$directory" ]]; then
              find "$directory" -type f \( -name '*.json' -o -name '*.jsonl' \) -print0 |
                while IFS= read -r -d '' file; do
                  magibu-toolcall benchmark validate "$file"
                done
            fi
          done

      - name: Validate source snapshots
        shell: bash
        run: |
          if [[ -d data/snapshots ]]; then
            python -m tool_call_tr.snapshots data/snapshots
          fi
